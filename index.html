<style>
:root{
  --paper:#eef1f4; --sheet:#fff; --ink:#14213a; --ink-2:#516073; --ink-3:#7d8896;
  --rule:#ccd4dd; --rule-2:#9fabba; --blue:#2b4c8c; --blue-soft:#e3eaf6;
  --sev-urgent:#a4161a; --sev-high:#bc6c25; --sev-medium:#3f6fa8; --sev-low:#8a95a3;
  --sev-question:#4a5a72; --ok:#2f6f4f;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.masthead{background:var(--sheet);border-bottom:1px solid var(--rule-2);padding:12px 20px;
  display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;position:sticky;top:0;z-index:40}
.masthead h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.masthead .addr{color:var(--ink-2);font-size:13.5px}
.tally{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tally b{font-weight:600;color:var(--ink)}
.mast-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{background:var(--sheet);border:1px solid var(--rule-2);color:var(--ink);padding:6px 11px;
  border-radius:2px;font-size:13.5px;font-weight:500;transition:background .12s,border-color .12s;
  display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--blue-soft);border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#223c70}
.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.quiet{border-color:var(--rule);color:var(--ink-2)}
.btn[hidden]{display:none}
.btn.danger:hover{background:#fbe9e8;border-color:var(--sev-urgent);color:var(--sev-urgent)}

.langsw{display:inline-flex;border:1px solid var(--rule-2);border-radius:2px;overflow:hidden}
.langsw button{border:0;background:var(--sheet);padding:6px 10px;font-size:13px;font-weight:500;font-family:var(--mono)}
.langsw button.on{background:var(--ink);color:#fff}

.wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.plan-col{position:sticky;top:56px;height:calc(100vh - 56px);border-right:1px solid var(--rule-2);
  background:var(--sheet);display:flex;flex-direction:column}
.list-col{min-height:calc(100vh - 56px);padding:0 0 80px}
@media (max-width:940px){
  .wrap{grid-template-columns:1fr}
  .plan-col{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule-2)}
  .plan-viewport{height:56vh}
}

.plan-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--rule)}
.plan-bar .spacer{margin-left:auto}
.zoomlab{font-family:var(--mono);font-size:12px;color:var(--ink-3);min-width:40px;text-align:center}
.plan-viewport{flex:1;position:relative;overflow:hidden;touch-action:none}
.plan-viewport.placing{cursor:crosshair}
.plan-canvas{position:absolute;top:0;left:0;transform-origin:0 0}
.plan-canvas img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.plan-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
.plan-empty[hidden]{display:none}
.plan-empty p{max-width:34ch;color:var(--ink-2);margin:0}

.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  border:2px solid var(--sheet);display:grid;place-items:center;font-family:var(--mono);
  font-size:12px;font-weight:600;color:#fff;box-shadow:0 1px 4px rgba(20,33,58,.45);transform-origin:center}
.pin.editable{cursor:grab}
.pin.dragging{cursor:grabbing}
.pin[data-sev="urgent"]{background:var(--sev-urgent)}
.pin[data-sev="high"]{background:var(--sev-high)}
.pin[data-sev="medium"]{background:var(--sev-medium)}
.pin[data-sev="low"]{background:var(--sev-low)}
.pin[data-sev="question"]{background:var(--sheet);color:var(--sev-question);border:2px solid var(--sev-question);box-shadow:0 1px 3px rgba(20,33,58,.3)}
.pin.done{opacity:.4}
.pin.sel{box-shadow:0 0 0 3px var(--sheet),0 0 0 6px var(--blue)}
@keyframes ping{from{box-shadow:0 0 0 0 rgba(43,76,140,.55)}to{box-shadow:0 0 0 22px rgba(43,76,140,0)}}
.pin.ping{animation:ping .7s ease-out 1}

.legend{display:flex;gap:15px;flex-wrap:wrap;align-items:center;padding:9px 14px;
  border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-2)}
.legend span{display:flex;gap:6px;align-items:center}
.sw{width:11px;height:11px;border-radius:2px;display:inline-block;flex:none}
.sw.hollow{background:var(--sheet);border:2px solid var(--sev-question);border-radius:50%}

.filters{padding:11px 20px;border-bottom:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap;
  align-items:center;background:var(--paper);position:sticky;top:56px;z-index:20}
@media (max-width:940px){.filters{position:static}}
.chip{border:1px solid var(--rule-2);background:var(--sheet);border-radius:2px;padding:4px 9px;
  font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.off{opacity:.4}
.chip .sw{width:9px;height:9px}
.filters input[type=search]{border:1px solid var(--rule-2);border-radius:2px;padding:5px 9px;background:var(--sheet);min-width:140px;flex:1}
.filters select{border:1px solid var(--rule-2);border-radius:2px;padding:5px 7px;background:var(--sheet)}

.rows{list-style:none;margin:0;padding:0}
.row{border-bottom:1px solid var(--rule);background:var(--sheet)}
.row.sel{background:#f6f9ff;box-shadow:inset 3px 0 0 var(--blue)}
.row.done .rhead-title{color:var(--ink-3)}
.rhead{width:100%;text-align:left;background:none;border:0;padding:13px 20px;
  display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;font:inherit}
.rhead:hover{background:#f6f9ff}
.rnum{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-3);padding-top:2px}
.rhead-title{font-weight:500;line-height:1.35;display:block}
.rmeta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:12.5px;color:var(--ink-2)}
.sev{display:inline-flex;gap:5px;align-items:center}
.stamp{border:1px solid var(--rule-2);border-radius:2px;padding:1px 6px;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.stamp[data-st="fixed"],.stamp[data-st="verified"]{border-color:var(--ok);color:var(--ok)}
.stamp[data-st="disputed"]{border-color:var(--sev-urgent);color:var(--sev-urgent)}
.stamp.off{border-style:dashed;color:var(--ink-3)}
.rcaret{color:var(--ink-3);font-size:12px;padding-top:3px}

.rbody{padding:0 20px 18px 62px;display:grid;gap:13px}
.rbody p{margin:0;color:var(--ink-2);max-width:66ch}
.rbody .alt{color:var(--ink-3);font-size:13.5px;border-left:2px solid var(--rule);padding-left:11px}
.rbody .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.field{display:grid;gap:4px}
.field label{font-size:12.5px;color:var(--ink-3)}
.field input,.field select,.field textarea{border:1px solid var(--rule-2);border-radius:2px;padding:6px 8px;background:var(--sheet);width:100%}
.field textarea{min-height:78px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}

.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative;width:98px;height:74px;border:1px solid var(--rule-2);overflow:hidden;background:var(--paper)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.shot button{position:absolute;top:2px;right:2px;border:0;background:rgba(20,33,58,.78);color:#fff;width:19px;height:19px;border-radius:2px;font-size:12px;line-height:1;display:grid;place-items:center}
.logitem{font-size:13px;color:var(--ink-2);border-left:2px solid var(--rule);padding:2px 0 2px 10px}
.logitem time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-right:8px}

.empty{padding:56px 20px;text-align:center;color:var(--ink-2)}
.empty h2{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 6px}

.sheetpanel{position:fixed;inset:0;background:rgba(20,33,58,.42);z-index:60;display:grid;place-items:center;padding:20px}
.sheetpanel[hidden]{display:none}
.panel{background:var(--sheet);border:1px solid var(--rule-2);max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px;display:grid;gap:13px}
.panel h2{margin:0;font-size:17px;font-weight:600}
.panel .note{font-size:13px;color:var(--ink-2);margin:0;max-width:60ch}
.lightbox img{max-width:92vw;max-height:88vh;border:3px solid var(--sheet)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:2px;font-size:13.5px;z-index:80}
.toast[hidden]{display:none}
.editonly{display:none}
body.editing .editonly{display:inline-flex}

.printsheet{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:11pt}
  .masthead,.plan-col,.filters,.rows,.toast,.sheetpanel,.empty{display:none!important}
  .wrap{display:block}
  .list-col{padding:0;min-height:0}
  .printsheet{display:block}
  .p-head{border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin-bottom:14px}
  .p-head h1{font-size:16pt;margin:0 0 3px}
  .p-head div{font-size:9.5pt;color:#333}
  .p-plan{width:100%;margin-bottom:16px;page-break-after:always}
  .p-plan img{max-width:100%}
  .p-item{page-break-inside:avoid;border-bottom:1px solid #bbb;padding:8px 0;display:grid;grid-template-columns:32px 1fr;gap:10px}
  .p-item .n{font-family:var(--mono);font-weight:600}
  .p-item h3{font-size:11pt;margin:0 0 3px;font-weight:600}
  .p-item .m{font-size:9pt;color:#333;margin:0 0 4px}
  .p-item p{margin:0;font-size:10.5pt}
  .p-shots{display:flex;gap:6px;margin-top:6px}
  .p-shots img{height:48mm;max-width:48%;object-fit:contain;border:1px solid #bbb}
}
</style>
</head>

    <p class="note" id="expNote2"></p>
    <div style="display:flex;justify-content:flex-end"><button class="btn" id="eClose"></button></div>

</div>

<div class="sheetpanel" id="lock" hidden="">
  <div class="panel" style="max-width:420px">

<script>
const TEMPLATE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

const SEV = {
  urgent:  {rank:0, color:'var(--sev-urgent)',   en:'Urgent',   pt:'Urgente'},

const STATUS = {
  reported:     {en:'Reported',     pt:'Comunicado'},
  acknowledged: {en:'Acknowledged', pt:'Recebido'},
  scheduled:    {en:'Scheduled',    pt:'Agendado'},
  fixed:        {en:'Fixed',        pt:'Resolvido'},
  verified:     {en:'Checked, OK',  pt:'Verificado, OK'},
  disputed:     {en:'Disputed',     pt:'Em desacordo'}

const DONE = ['fixed','verified'];

const UI = {
  en:{
    edit:'Edit', editDone:'Done editing', add:'Add an issue', placing:'Click the plan to place it',
    changePlan:'Change floor plan', fit:'Fit all', details:'Details', print:'Print / PDF',
    copy:'Copy as text', exportBtn:'Export', close:'Close', search:'Search',
    anyStatus:'Any status', notResolved:'Not yet resolved',
    byNumber:'By number', bySeverity:'By priority', byRoom:'By room',
    logged:'logged', outstanding:'outstanding', urgent:'urgent',
    email:'Email about this', addPhotos:'Add photos', addNote:'Add a note',
    del:'Delete', place:'Add a pin', clearPins:'Remove pins', offPlan:'Not on the plan',
    noPlan:'Add a floor plan and every issue gets a pin you can point at.', addPlan:'Add a floor plan',
    noMatch:'Nothing matches those filters', noMatchSub:'Widen the search or clear a filter.',
    noneYet:'No issues logged yet', noneYetSub:'Turn on Edit, then drop your first pin on the plan.',
    setTitle:'Property and contact details',
    setNote:'These fill the heading, the printed sheet, and every issue email.',
    lProp:'Property', lAddr:'Address', lTen:'Your name', lRef:'Reference prefix',
    lMail:'Agency email', lMyMail:'Your email', lCc:'Copy to (optional)', lUrl:'Public link to this page (optional)',
    mailNote:'On your working copy the buttons write to the agency. On the shared copy they write to you, because there it is the agency doing the clicking.',
    replyBtn:'Reply about this',
    expTitle:'Export',
    expNote:'The shareable copy has no editing controls, so the agency sees a clean read-only page. Keep the working copy for yourself.',

    dateF:'First reported', sevF:'Priority', statF:'Status',
    saved:'Saved', notSaved:'Not saved yet — use Export', exportToSave:'Export to save your work',

  },
  pt:{

    copy:'Copiar como texto', exportBtn:'Exportar', close:'Fechar', search:'Pesquisar',

    byNumber:'Por número', bySeverity:'Por prioridade', byRoom:'Por divisão',
    logged:'registados', outstanding:'em aberto', urgent:'urgentes',
    email:'Enviar email sobre este ponto', addPhotos:'Adicionar fotos', addNote:'Adicionar nota',
    del:'Eliminar', place:'Marcar na planta', clearPins:'Remover marcadores', offPlan:'Fora da planta',
    noPlan:'Adicione uma planta e cada ponto passa a ter um marcador.', addPlan:'Adicionar planta',
    noMatch:'Nada corresponde a estes filtros', noMatchSub:'Alargue a pesquisa ou limpe um filtro.',
    noneYet:'Ainda não há pontos registados', noneYetSub:'Ative Editar e marque o primeiro ponto na planta.',
    setTitle:'Dados do imóvel e contactos',
    setNote:'Preenchem o cabeçalho, a folha impressa e todos os emails.',
    lProp:'Imóvel', lAddr:'Morada', lTen:'O seu nome', lRef:'Prefixo de referência',
    lMail:'Email da agência', lMyMail:'O seu email', lCc:'Com cópia para (opcional)', lUrl:'Link público desta página (opcional)',
    mailNote:'Na sua cópia de trabalho os botões escrevem para a agência. Na cópia partilhada escrevem para si, porque aí é a agência que está a clicar.',
    replyBtn:'Responder sobre este ponto',
    expTitle:'Exportar',
    expNote:'A cópia para partilhar não tem controlos de edição, pelo que a agência vê uma página só de leitura. Guarde a cópia de trabalho para si.',
    expNote2:'Carregue a cópia para partilhar em qualquer alojamento estático e envie esse link à agência. Cada ponto abre um email já preenchido no idioma apresentado.',
    expProt:'Cópia protegida por palavra-passe', expShare:'Cópia aberta para partilhar', expWork:'Cópia de trabalho',
    expJson:'Só os dados (JSON)', impJson:'Carregar ficheiro JSON',
    passPrompt:'Escolha uma palavra-passe para a cópia partilhada. Quem não a tiver vê apenas um pedido de palavra-passe.',

    descF:'Descrição (inglês)', descF2:'Descrição (português)',
    dateF:'Comunicado em', sevF:'Prioridade', statF:'Estado',

    planAdded:'Planta adicionada', copied:'Copiado', dataLoaded:'Dados carregados',
    badJson:'Esse ficheiro não é uma exportação desta lista', needPlan:'Adicione primeiro uma planta',
    notePrompt:'Nota (o que mudou, quem disse o quê, quando)',
    delConfirm:'Eliminar este ponto? Não é possível anular.',

  }
};

const $ = s => document.querySelector(s);
const el = (t,c) => { const n=document.createElement(t); if(c) n.className=c; return n; };
const esc = s => String(s??'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const today = () => new Date().toISOString().slice(0,10);
const uid = () => 'i' + Math.random().toString(36).slice(2,9);

const PAYLOAD = JSON.parse($('#snag-data').textContent);
let state = PAYLOAD.enc ? null : PAYLOAD;
let lang = (state && state.lang) || PAYLOAD.lang || 'pt';

const TE = new TextEncoder(), TD = new TextDecoder();
function b64(buf){
  const u = new Uint8Array(buf); let out = '';
  for(let i = 0; i < u.length; i += 0x8000) out += String.fromCharCode.apply(null, u.subarray(i, i+0x8000));
  return btoa(out);
}
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
const hasCrypto = () => !!(window.crypto && window.crypto.subtle);

async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', TE.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sealState(pass, obj){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, TE.encode(JSON.stringify(obj)));
  return {enc:1, lang, salt:b64(salt), iv:b64(iv), ct:b64(ct)};
}
async function openState(pass, env){
  const key = await deriveKey(pass, unb64(env.salt));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(env.iv)}, key, unb64(env.ct));
  return JSON.parse(TD.decode(pt));
}
let editing = false, selected = null, expanded = new Set();
let zoom = 1, panX = 0, panY = 0, planNatural = {w:0,h:0}, fitScale = 1;
let placing = null;
let filters = {q:'', sev:new Set(Object.keys(SEV)), status:'', sort:'n'};

const t = k => UI[lang][k];
const tx = o => (o && typeof o === 'object') ? (o[lang] || o.en || o.pt || '') : (o || '');
const other = () => lang === 'en' ? 'pt' : 'en';
const isDone = i => DONE.includes(i.status);
const sevLabel = k => SEV[k][lang];
const statLabel = k => (STATUS[k] || STATUS.reported)[lang];

/* ---------- persistence ---------- */
const store = {
  ok: typeof window.storage !== 'undefined' && !!window.storage,
  async get(k){ try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){ return null; } },
  async set(k,v){ try{ await window.storage.set(k,v); return true; }catch(e){ return false; } }
};
let saveTimer = null;
function scheduleSave(){
  if(!store.ok || state.published) return;
  clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 700);
}
async function doSave(){
  const doc = {meta:state.meta, lang, issues:state.issues.map(i => ({...i, photos:[]}))};
  const a = await store.set('br:doc', JSON.stringify(doc));
  await store.set('br:plan', state.plan ? JSON.stringify(state.plan) : '');
  for(const i of state.issues) await store.set('br:ph:'+i.id, JSON.stringify(i.photos||[]));
  const sn = $('#saveNote');
  if(sn) sn.textContent = a
    ? t('saved') + ' ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
    : t('notSaved');
}
async function restore(){
  if(!store.ok || state.published) return;
  const raw = await store.get('br:doc'); if(!raw) return;
  try{
    const doc = JSON.parse(raw);
    const plan = await store.get('br:plan');
    state.meta = doc.meta; state.issues = doc.issues;
    if(doc.lang) lang = doc.lang;
    state.plan = plan ? JSON.parse(plan) : null;
    for(const i of state.issues){
      const p = await store.get('br:ph:'+i.id);
      i.photos = p ? JSON.parse(p) : [];
    }
  }catch(e){}
}

/* ---------- images ---------- */
function readImage(file, maxEdge, quality){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Could not read that file'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('That file is not an image we can read'));
      img.onload = () => {
        const s = Math.min(1, maxEdge / Math.max(img.width, img.height));
        const w = Math.round(img.width*s), h = Math.round(img.height*s);
        const cv = el('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        res({data: cv.toDataURL('image/jpeg', quality), w, h});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- plan ---------- */
const planFor = () => state.plan ? (state.plan[lang] || state.plan.en || state.plan.pt) : null;

function applyTransform(){
  $('#canvas').style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  $('#zLab').textContent = Math.round(zoom/fitScale*100) + '%';
  document.querySelectorAll('.pin').forEach(p => p.style.transform = `scale(${1/zoom})`);
}
function fitPlan(){
  if(!planNatural.w) return;
  const vp = $('#viewport').getBoundingClientRect(), pad = 16;
  fitScale = Math.min((vp.width-pad*2)/planNatural.w, (vp.height-pad*2)/planNatural.h);
  zoom = fitScale;
  panX = (vp.width - planNatural.w*zoom)/2;
  panY = (vp.height - planNatural.h*zoom)/2;
  applyTransform();
}
function loadPlan(keepView){
  const p = planFor(), img = $('#planImg');
  if(!p){ $('#planEmpty').hidden = false; img.removeAttribute('src'); return; }
  $('#planEmpty').hidden = true;
  img.src = p.data;
  const done = () => {
    planNatural = {w: img.naturalWidth || p.w, h: img.naturalHeight || p.h};
    img.style.width = planNatural.w + 'px';
    if(!keepView) fitPlan(); else applyTransform();
    renderPins();
  };
  if(img.complete && img.naturalWidth) done(); else img.onload = done;
}
function renderPins(){
  document.querySelectorAll('.pin').forEach(p => p.remove());
  if(!planNatural.w) return;
  const cv = $('#canvas');
  for(const i of state.issues){
    (i.pins || []).forEach((pt, idx) => {
      const p = el('button','pin'); p.type = 'button';
      p.dataset.id = i.id; p.dataset.idx = idx; p.dataset.sev = i.severity;
      p.style.left = (pt.x*planNatural.w)+'px';
      p.style.top = (pt.y*planNatural.h)+'px';
      p.textContent = i.n;
      p.setAttribute('aria-label', t('issue') + ' ' + i.n + ': ' + tx(i.title));
      p.title = i.n + '. ' + tx(i.title);
      if(isDone(i)) p.classList.add('done');
      if(i.id === selected) p.classList.add('sel');
      if(editing) p.classList.add('editable');
      cv.appendChild(p);
    });
  }
  applyTransform();
}
function updatePin(id){
  const i = state.issues.find(x => x.id === id);
  if(!i) return;
  document.querySelectorAll('.pin[data-id="'+id+'"]').forEach(p => {
    p.dataset.sev = i.severity;
    p.classList.toggle('done', isDone(i));
    p.title = i.n + '. ' + tx(i.title);
  });
}

/* ---------- list ---------- */
function visibleIssues(){
  const q = filters.q.toLowerCase();
  let out = state.issues.filter(i => {
    if(!filters.sev.has(i.severity)) return false;
    if(filters.status === 'open' && isDone(i)) return false;
    if(filters.status && filters.status !== 'open' && i.status !== filters.status) return false;
    if(q){
      const hay = [tx(i.title), tx(i.room), tx(i.description), i.title.en, i.title.pt].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(filters.sort === 'sev') out.sort((a,b) => SEV[a.severity].rank - SEV[b.severity].rank || a.n - b.n);
  else if(filters.sort === 'room') out.sort((a,b) => tx(a.room).localeCompare(tx(b.room)) || a.n - b.n);
  else out.sort((a,b) => a.n - b.n);
  return out;
}

function refOf(i){ return (state.meta.ref || 'REF') + '-' + String(i.n).padStart(2,'0'); }

function mailtoFor(i){
  const m = state.meta;
  const subject = `${refOf(i)} · ${m.property || ''} · ${tx(i.title)}`.replace(/ · +·/g,' ·');
  const lines = [
    `${t('issue')} ${refOf(i)}`,
    `${t('location')}: ${tx(i.room) || '—'}`,
    `${t('priority')}: ${sevLabel(i.severity)}`,
    `${t('status')}: ${statLabel(i.status)}`,
    `${t('reportedOn')}: ${i.created}`,
    '',
    tx(i.description) || '',
    ''
  ];
  if(m.siteUrl) lines.push(`${t('fullList')}: ${m.siteUrl}`, '');
  lines.push('— — —', t('replyAbove'));
  if(!state.published && m.tenant) lines.push(m.tenant);
  const params = [];
  if(m.agencyCc) params.push('cc=' + encodeURIComponent(m.agencyCc));
  params.push('subject=' + encodeURIComponent(subject));
  params.push('body=' + encodeURIComponent(lines.join('\r\n')));
  const to = state.published ? (m.tenantEmail || '') : (m.agencyEmail || '');
  return 'mailto:' + to + '?' + params.join('&');
}

function rowMeta(i){
  const s = SEV[i.severity];
  const sw = s.hollow ? '<i class="sw hollow"></i>' : `<i class="sw" style="background:${s.color}"></i>`;

    ${tx(i.room) ? '<span>'+esc(tx(i.room))+'</span>' : ''}
    <span class="stamp" data-st="${i.status}">${statLabel(i.status)}</span>
    ${!(i.pins||[]).length ? '<span class="stamp off">'+t('offPlan')+'</span>' : ''}`;
}

/* ---------- plan interaction ---------- */
const vp = $('#viewport');
let drag = null, pinDrag = null, photoTarget = null;

function normFromEvent(e){
  const r = $('#canvas').getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)),
    y: Math.min(1, Math.max(0, (e.clientY - r.top)/r.height))
  };
}
function startPlacing(mode, id){
  if(!planFor()){ toast(t('needPlan')); return; }
  placing = {mode, id};
  vp.classList.add('placing');
  $('#btnAdd').classList.add('on');
  $('#btnAdd').textContent = t('placing');
  vp.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function stopPlacing(){
  placing = null;
  vp.classList.remove('placing');
  $('#btnAdd').classList.remove('on');
  $('#btnAdd').textContent = t('add');
}

vp.addEventListener('pointerdown', e => {
  const pin = e.target.closest('.pin');
  if(pin && editing && !placing){
    pinDrag = {id: pin.dataset.id, idx: +pin.dataset.idx, el: pin, moved:false};
    pin.classList.add('dragging'); pin.setPointerCapture(e.pointerId);
    return;
  }
  if(pin) return;
  if(placing && planNatural.w){
    const {x,y} = normFromEvent(e);
    if(placing.mode === 'new') addIssue(x,y);
    else {
      const i = state.issues.find(v => v.id === placing.id);
      if(i){ (i.pins ||= []).push({x, y}); }
      stopPlacing(); renderPins(); renderList(); scheduleSave();
    }
    return;
  }
  drag = {sx:e.clientX, sy:e.clientY, px:panX, py:panY};
});
vp.addEventListener('pointermove', e => {
  if(pinDrag){
    const i = state.issues.find(x => x.id === pinDrag.id);
    const {x,y} = normFromEvent(e);
    i.pins[pinDrag.idx] = {x, y}; pinDrag.moved = true;
    pinDrag.el.style.left = (x*planNatural.w)+'px';
    pinDrag.el.style.top = (y*planNatural.h)+'px';
    return;
  }
  if(drag){ panX = drag.px + (e.clientX-drag.sx); panY = drag.py + (e.clientY-drag.sy); applyTransform(); }
});
window.addEventListener('pointerup', () => {
  if(pinDrag){
    pinDrag.el.classList.remove('dragging');
    if(!pinDrag.moved) openIssue(pinDrag.id); else scheduleSave();
    pinDrag = null; return;
  }
  drag = null;
});
vp.addEventListener('click', e => {
  const pin = e.target.closest('.pin');
  if(pin && !editing) openIssue(pin.dataset.id);
});
vp.addEventListener('wheel', e => {
  if(!planNatural.w) return;
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  const cx = e.clientX-r.left, cy = e.clientY-r.top;
  const nz = Math.min(fitScale*8, Math.max(fitScale*0.5, zoom*(e.deltaY<0 ? 1.12 : 1/1.12)));
  panX = cx-(cx-panX)*(nz/zoom); panY = cy-(cy-panY)*(nz/zoom); zoom = nz; applyTransform();
}, {passive:false});
function zoomBy(f){
  const r = vp.getBoundingClientRect(), cx = r.width/2, cy = r.height/2;
  const nz = Math.min(fitScale*8, Math.max(fitScale*0.5, zoom*f));
  panX = cx-(cx-panX)*(nz/zoom); panY = cy-(cy-panY)*(nz/zoom); zoom = nz; applyTransform();
}
$('#zIn').onclick = () => zoomBy(1.25);
$('#zOut').onclick = () => zoomBy(1/1.25);
$('#zFit').onclick = fitPlan;
window.addEventListener('resize', () => { if(planNatural.w) fitPlan(); });

function addIssue(x,y){
  const i = {id:uid(), n:state.issues.length+1,
    title:{en:'New issue', pt:'Novo ponto'}, room:{en:'', pt:''}, description:{en:'', pt:''},
    severity:'medium', status:'reported', pins:[{x,y}], created:today(), photos:[], log:[]};

  stopPlacing(); expanded.add(i.id); select(i.id);

/* ---------- export ---------- */
function download(name, text, type){
  const b = new Blob([text], {type: type || 'text/plain;charset=utf-8'});
  const a = el('a'); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function buildHtml(published, envelope){
  const data = JSON.stringify(envelope || {...state, lang, published})
    .replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return TEMPLATE.replace(
    /(<script type="application\/json" id="snag-data">)[\s\S]*?(<\/script>)/,
    (_,a,z) => a + '\n' + data + '\n' + z
  );
}
const slug = () => (state.meta.property || 'snag-list').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
$('#btnExport').onclick = () => $('#exportPanel').hidden = false;
$('#eClose').onclick = () => $('#exportPanel').hidden = true;
$('#expShare').onclick = () => download('index.html', buildHtml(true), 'text/html');
$('#expProt').onclick = async () => {
  if(!hasCrypto()){ toast(t('noCrypto')); return; }
  const pass = prompt(t('passPrompt'));
  if(!pass) return;
  const env = await sealState(pass, {...state, lang, published:true});
  download('index.html', buildHtml(true, env), 'text/html');
  const base = state.meta.siteUrl || 'https://…/';
  $('#expNote2').textContent = t('protHint') + ' ' + base.replace(/#.*$/,'') + '#k=' + encodeURIComponent(pass);
};
$('#expWork').onclick = () => download(slug()+'-working.html', buildHtml(false), 'text/html');
$('#expJson').onclick = () => download(slug()+'.json', JSON.stringify({...state, lang}, null, 2), 'application/json');
$('#impJson').onclick = () => $('#fileJson').click();

$('#btnPrint').onclick = () => window.print();
$('#btnCopy').onclick = async () => {
  const m = state.meta, items = visibleIssues();
  const txt = [`${m.property||''}${m.address ? ' — '+m.address : ''}`, `${t('issued')} ${today()}`, '']
    .concat(items.map(i => `${refOf(i)} [${sevLabel(i.severity)}] ${tx(i.room) ? tx(i.room)+' — ' : ''}${tx(i.title)}\n    ${tx(i.description).replace(/\n/g,'\n    ')}\n    ${t('status')}: ${statLabel(i.status)}`))
    .join('\n\n');
  try{ await navigator.clipboard.writeText(txt); toast(t('copied') + ' (' + items.length + ')'); }
  catch(e){ download(slug()+'.txt', txt); }
};

/* ---------- edit + settings ---------- */
$('#btnEdit').onclick = () => {
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  $('#btnEdit').classList.toggle('on', editing);
  $('#btnEdit').textContent = editing ? t('editDone') : t('edit');
  stopPlacing(); renderPins(); renderList();
};
function fillSettings(){
  const m = state.meta;
  $('#sProp').value=m.property||''; $('#sAddr').value=m.address||''; $('#sTen').value=m.tenant||'';
  $('#sRef').value=m.ref||''; $('#sMail').value=m.agencyEmail||''; $('#sMyMail').value=m.tenantEmail||'';
  $('#sCc').value=m.agencyCc||''; $('#sUrl').value=m.siteUrl||'';
}
$('#btnSettings').onclick = () => { fillSettings(); $('#settings').hidden = false; };
$('#sClose').onclick = () => $('#settings').hidden = true;
$('#settings').addEventListener('input', () => {
  Object.assign(state.meta, {property:$('#sProp').value, address:$('#sAddr').value, tenant:$('#sTen').value,
    ref:$('#sRef').value, agencyEmail:$('#sMail').value, tenantEmail:$('#sMyMail').value,
    agencyCc:$('#sCc').value, siteUrl:$('#sUrl').value});
  renderTally(); renderList(); scheduleSave();
});
document.querySelectorAll('.sheetpanel').forEach(p =>
  p.addEventListener('click', e => { if(e.target === p) p.hidden = true; }));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ document.querySelectorAll('.sheetpanel').forEach(p => p.hidden = true); if(placing) stopPlacing(); }
});

/* ---------- filters ---------- */
function buildChips(){
  const c = $('#sevChips'); c.innerHTML = '';
  for(const k of Object.keys(SEV)){
    const b = el('button','chip'); b.type='button';
    b.innerHTML = (SEV[k].hollow ? '<i class="sw hollow"></i>' : `<i class="sw" style="background:${SEV[k].color}"></i>`) + sevLabel(k);
    if(!filters.sev.has(k)) b.classList.add('off');
    b.setAttribute('aria-pressed', filters.sev.has(k) ? 'true':'false');
    b.onclick = () => {
      if(filters.sev.has(k)) filters.sev.delete(k); else filters.sev.add(k);
      b.classList.toggle('off', !filters.sev.has(k));
      b.setAttribute('aria-pressed', filters.sev.has(k) ? 'true':'false');
      renderList();
    };
    c.appendChild(b);
  }
}
$('#q').oninput = e => { filters.q = e.target.value; renderList(); };
$('#fStatus').onchange = e => { filters.status = e.target.value; renderList(); };
$('#fSort').onchange = e => { filters.sort = e.target.value; renderList(); };

let toastTimer;
function toast(msg){
  const el2 = $('#toast'); el2.textContent = msg; el2.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el2.hidden = true, 2600);
}

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  $('#langEn').classList.toggle('on', lang === 'en');
  $('#langPt').classList.toggle('on', lang === 'pt');
  $('#btnSettings').textContent = t('details');
  $('#btnPrint').textContent = t('print');
  $('#btnCopy').textContent = t('copy');
  $('#btnExport').textContent = t('exportBtn');
  $('#btnEdit').textContent = editing ? t('editDone') : t('edit');
  $('#btnAdd').textContent = placing ? t('placing') : t('add');
  $('#btnPlan').textContent = $('#btnPlan2').textContent = t('changePlan');
  $('#zFit').textContent = t('fit');
  $('#planEmptyText').textContent = t('noPlan');
  $('#btnPlan2').textContent = t('addPlan');
  $('#q').placeholder = t('search');
  $('#q').setAttribute('aria-label', t('search'));

  $('#fStatus').innerHTML = `<option value="">${t('anyStatus')}</option><option value="open">${t('notResolved')}</option>` +
    Object.keys(STATUS).map(k => `<option value="${k}">${statLabel(k)}</option>`).join('');
  $('#fStatus').value = filters.status;
  $('#fSort').innerHTML = `<option value="n">${t('byNumber')}</option><option value="sev">${t('bySeverity')}</option><option value="room">${t('byRoom')}</option>`;
  $('#fSort').value = filters.sort;

  $('#legend').innerHTML = Object.keys(SEV).map(k =>
    `<span>${SEV[k].hollow ? '<i class="sw hollow"></i>' : `<i class="sw" style="background:${SEV[k].color}"></i>`}${sevLabel(k)}</span>`
  ).join('') + '<span id="saveNote" style="margin-left:auto;font-family:var(--mono);font-size:11.5px"></span>';

  $('#setTitle').textContent = t('setTitle'); $('#setNote').textContent = t('setNote');
  $('#lProp').textContent=t('lProp'); $('#lAddr').textContent=t('lAddr'); $('#lTen').textContent=t('lTen');
  $('#lRef').textContent=t('lRef'); $('#lMail').textContent=t('lMail'); $('#lMyMail').textContent=t('lMyMail');
  $('#lCc').textContent=t('lCc'); $('#lUrl').textContent=t('lUrl'); $('#mailNote').textContent=t('mailNote');
  $('#sClose').textContent = t('close'); $('#eClose').textContent = t('close');
  $('#expTitle').textContent=t('expTitle'); $('#expNote').textContent=t('expNote'); $('#expNote2').textContent=t('expNote2');
  $('#expProt').textContent=t('expProt'); $('#expShare').textContent=t('expShare'); $('#expWork').textContent=t('expWork');
  $('#expJson').textContent=t('expJson'); $('#impJson').textContent=t('impJson');

  buildChips(); renderList();
}
function setLang(l){
  if(l === lang) return;
  lang = l; state.lang = l;
  applyLang(); loadPlan(true); scheduleSave();
}
$('#langEn').onclick = () => setLang('en');
$('#langPt').onclick = () => setLang('pt');

/* ---------- boot ---------- */
async function boot(){
  await restore();
  if(state.published) $('#btnEdit').hidden = true;
  applyLang();
  fillSettings();
  loadPlan();
  if(!state.published && !store.ok){
    const n = $('#saveNote'); if(n) n.textContent = t('exportToSave');
  }
}

function showLock(env, err){
  const L = UI[lang];
  $('#lockTitle').textContent = L.lockTitle;
  $('#lockNote').textContent = L.lockNote;
  $('#lockGo').textContent = L.lockGo;
  $('#lockErr').textContent = err || '';
  $('#lock').hidden = false;
  const input = $('#lockPass');
  input.focus();
  const attempt = async () => {
    const pass = input.value;
    if(!pass) return;
    $('#lockGo').disabled = true; $('#lockErr').textContent = '';
    try{
      state = await openState(pass, env);
      lang = state.lang || lang;
      $('#lock').hidden = true;
      await boot();
    }catch(e){
      $('#lockGo').disabled = false;
      $('#lockErr').textContent = L.lockErr;
      input.select();
    }
  };
  $('#lockGo').onclick = attempt;
  input.onkeydown = e => { if(e.key === 'Enter') attempt(); };
}

(async function start(){
  if(!PAYLOAD.enc){ await boot(); return; }
  if(!hasCrypto()){
    $('#lock').hidden = false;
    $('#lockTitle').textContent = UI[lang].lockTitle;
    $('#lockNote').textContent = UI[lang].noCrypto;
    $('#lockPass').hidden = true; $('#lockGo').hidden = true;
    return;
  }
  const m = /(?:^|[#&])k=([^&]*)/.exec(location.hash);
  if(m){
    try{
      state = await openState(decodeURIComponent(m[1]), PAYLOAD);
      lang = state.lang || lang;
      await boot();
      return;
    }catch(e){}
  }
  showLock(PAYLOAD);
})();
</script></body></html>
